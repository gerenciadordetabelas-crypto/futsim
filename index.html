function applyBrazilPromotionRelegation(){
 // A movimentação só usa clubes já cadastrados e só acontece ao fechar a temporada nacional.
 const normalize=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 const brazil=state.leagues.filter(l=>normalize(leagueCountry(l))==='brasil');
 const a=brazil.find(l=>/serie\s*a/.test(normalize(l.name))||['campeonato brasileiro','brasileirao'].includes(normalize(l.name)));
 const b=brazil.find(l=>/serie\s*b/.test(normalize(l.name)));
 if(!a||!b||a.id===b.id)return {error:'Não encontrei campeonatos identificáveis como Série A e Série B do Brasil.'};
 if(a.kind!=='Liga'||b.kind!=='Liga')return {error:'Série A e Série B precisam estar configuradas no formato Liga.'};
 if(playedCount(a)<a.fixtures.length||playedCount(b)<b.fixtures.length)return {error:'É necessário concluir todos os jogos da Série A e da Série B antes de definir acesso e rebaixamento.'};
 if(a.seasonCompleted&&b.seasonCompleted&&a.lastMovementSeason===a.season&&b.lastMovementSeason===b.season)return {alreadyApplied:true};
 const aRows=standings(a),bRows=standings(b);
 if(aRows.length<4||bRows.length<6)return {error:'Não há clubes suficientes nas tabelas para aplicar acesso e rebaixamento.'};
 const relegated=aRows.slice(-4).map(t=>t.id);
 const direct=bRows.slice(0,2).map(t=>t.id);
 const pairs=[[bRows[2].id,bRows[5].id],[bRows[3].id,bRows[4].id]];
 const playoffWinners=[],playoffResults=[];
 for(let idx=0;idx<pairs.length;idx++){
   const pair=pairs[idx],agg={[pair[0]]:0,[pair[1]]:0};
   for(let leg=0;leg<2;leg++){
     const home=leg===0?pair[0]:pair[1],away=leg===0?pair[1]:pair[0];
     const res=play({id:b.id},{homeId:home,awayId:away,round:39+idx*2+leg});
     if(!res)continue;
     agg[home]+=res.hg;agg[away]+=res.ag;
     res.playoff=true;res.playoffLabel=(idx===0?'Playoff 3º x 6º':'Playoff 4º x 5º')+' · '+(leg===0?'ida':'volta');
     playoffResults.push({...res});
   }
   let winner;
   if(agg[pair[0]]===agg[pair[1]]){
     // Desempate determinístico e transparente quando o agregado termina igual.
     const p1=bRows.find(t=>t.id===pair[0]),p2=bRows.find(t=>t.id===pair[1]);
     winner=(p1.pts!==p2.pts?(p1.pts>p2.pts?pair[0]:pair[1]):(p1.v!==p2.v?(p1.v>p2.v?pair[0]:pair[1]):pair[0]));

 a.lastMovementSeason=a.season;b.lastMovementSeason=b.season;
 const archived=state.seasons.find(s=>s.leagueId===b.id&&Number(s.season)===(Number(b.season)||1));

 return {promoted,relegated,playoffResults};
}

function applyEnglandPromotionRelegation(){

 const england=state.leagues.filter(l=>norm(leagueCountry(l))==='inglaterra');
 const a=england.find(l=>/premier league/i.test(String(l.name||'')));
 const b=england.find(l=>/championship/i.test(String(l.name||'')+' '+String(l.shortName||'')));
 if(!a||!b)return {error:'Não encontrei a Premier League e a EFL Championship.'};

 const aRows=standings(a),bRows=standings(b);

 [homeId,awayId,leg,offset] of [[a,b,'ida',0],[b,a,'volta',1]])if(!fixtures.some(f=>f.homeId===homeId&&f.awayId===awayId))fixtures.push({homeId,awayId,round:round+offset,playoffStage:'Quartas de final',playoffLabel:label+' · '+leg});}}l.playoffFixtures=fixtures;return true}
function playoffWinner(l,homeId,awayId){const pair=state.results.filter(r=>r.leagueId===l.id&&r.playoff&&((r.homeId===homeId&&r.awayId===awayId)||(r.homeId===awayId&&r.awayId===homeId)));if(!pair.length)return null;const score=pair.reduce((a,r)=>{a[r.homeId]=(a[r.homeId]||0)+r.hg;a[r.awayId]=(a[r.awayId]||0)+r.ag;return a},{});if((score[homeId]||0)!==(score[awayId]||0))return (score[homeId]||0)>(score[awayId]||0)?homeId:awayId;const rows=standings(l),h=rows.find(t=>t.id===homeId),a=rows.find(t=>t.id===awayId);return h&&a?(h.pts!==a.pts?(h.pts>a.pts?homeId:awayId):(h.v>=a.v?homeId:awayId)):homeId}

if(page==='sobre'){app.innerHTML='<div class="topline"><div><h1>Sobre o FutSim</h1><div class="muted">Gerenciador de campeonatos com resultados simulados.</div></div></div><section class="card"><div class="cardbody"><h2>Como funciona</h2><p class="muted">Cada clube tem uma força dinâmica de 1 a 100. Vitórias, empates e derrotas alteram essa nota de acordo com a força relativa do adversário; vencer um time mais forte rende mais, e perder para um mais fraco custa mais. A nota atual influencia os próximos placares.</p><p class="muted">Os dados são salvos no armazenamento local deste navegador. A força atual é recalculada a partir do histórico existente uma única vez e continua evoluindo nas novas partidas. Clubes reais podem ser usados, mas todos os placares são fictícios.</p><p class="muted">A opção Copa ainda usa uma lista de confrontos em vez de chave eliminatória.</p><button class="danger" data-reset>Restaurar dados iniciais</button></div></section>'}
app.querySelectorAll('[data-calendar-select]').forEach(s=>s.addEventListener('change',()=>{selectedRounds[Number(s.dataset.calendarSelect)]=Number(s.value);render()}));
app.querySelectorAll('[data-calendar-prev]').forEach(b=>b.addEventListener('click',()=>{const id=Number(b.dataset.calendarPrev),l=state.leagues.find(x=>x.id===id);if(l){const n=Number(selectedRounds[id]||nextRound(l)||1);selectedRounds[id]=Math.max(1,n-1);render()}}));
app.querySelectorAll('[data-calendar-next]').forEach(b=>b.addEventListener('click',()=>{const id=Number(b.dataset.calendarNext),l=state.leagues.find(x=>x.id===id);if(l){const max=Math.max(...l.fixtures.map(f=>Number(f.round)||1),1),n=Number(selectedRounds[id]||nextRound(l)||1);selectedRounds[id]=Math.min(max,n+1);render()}}));
app.querySelectorAll('[data-team-detail]').forEach(b=>b.addEventListener('click',()=>showTeamDetails(Number(b.dataset.teamDetail))));
app.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.go)));
app.querySelectorAll('[data-end-season]').forEach(b=>b.addEventListener('click',()=>endSeason(Number(b.dataset.endSeason))));app.querySelectorAll('[data-next-season]').forEach(b=>b.addEventListener('click',()=>startNextSeason(Number(b.dataset.nextSeason))));
app.querySelectorAll('[data-round]').forEach(b=>b.addEventListener('click',()=>simulateRound(Number(b.dataset.round))));
app.querySelectorAll('[data-all]').forEach(b=>b.addEventListener('click',()=>simulateAll(Number(b.dataset.all))));
app.querySelectorAll('[data-pick-league]').forEach(b=>b.addEventListener('click',()=>{selectedLeagueId=Number(b.dataset.pickLeague);setPage('classificacao')}));
app.querySelectorAll('[data-delete-league]').forEach(b=>b.addEventListener('click',()=>deleteLeague(Number(b.dataset.deleteLeague))));
app.querySelectorAll('[data-delete-team]').forEach(b=>b.addEventListener('click',()=>deleteTeam(Number(b.dataset.deleteTeam))));
app.querySelector('[data-clear]')?.addEventListener('click',()=>{if(confirm('Apagar todos os resultados?')){state.results=[];save();render()}});
app.querySelector('[data-reset]')?.addEventListener('click',()=>{if(confirm('Apagar seus dados e restaurar os clubes iniciais?')){localStorage.removeItem('futsim_v2');state=null;location.reload()}});
}
render();
</script></body></html>
