<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FutSim — Simulador de campeonatos</title>
<style>
:root{--bg:#0b1220;--panel:#121d2e;--panel2:#18263a;--line:#26364c;--text:#eef4fc;--muted:#94a8c0;--green:#39d98a;--blue:#63a8ff;--red:#ff6b78}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:var(--text);background:#203149;border:1px solid #30445e;border-radius:9px;padding:9px 12px}button:hover{filter:brightness(1.16)}button.primary{background:var(--green);border-color:var(--green);color:#062316;font-weight:750}button.danger{color:#ff9aa4}input,select{width:100%;background:#0d1726;border:1px solid var(--line);color:var(--text);padding:11px;border-radius:9px}header{display:flex;align-items:center;gap:12px;padding:17px max(18px,calc((100% - 1180px)/2));border-bottom:1px solid var(--line);background:#0e1827;position:sticky;top:0;z-index:2}.logo{display:flex;align-items:center;gap:10px;font-weight:850;font-size:20px;white-space:nowrap}.ball{display:grid;place-items:center;width:38px;height:38px;background:var(--green);color:#052516;border-radius:11px;font-size:21px}header small{display:block;font-size:11px;color:var(--muted);font-weight:500}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:22px;max-width:1180px;margin:auto;padding:24px 18px}.nav{display:flex;flex-direction:column;gap:7px;align-self:start;position:sticky;top:88px}.nav button{text-align:left;background:transparent;border-color:transparent;color:var(--muted)}.nav button.active{background:#183329;color:var(--green);border-color:#285640}.content{min-width:0}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}h1{font-size:26px;line-height:1.2;margin:0 0 6px}h2{font-size:17px;margin:0}.muted{color:var(--muted)}.small{font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}.stat{padding:17px}.stat strong{display:block;font-size:27px}.stat span{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.stack{display:flex;flex-direction:column;gap:15px}.card{overflow:hidden;margin-bottom:14px}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 17px;border-bottom:1px solid var(--line)}.cardbody{padding:16px}.empty{padding:24px;text-align:center;color:var(--muted)}.formrow{display:flex;gap:9px;align-items:center;margin-bottom:12px}.formrow>*{flex:1;min-width:0}.clublist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.club{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;background:var(--panel2);border-radius:9px}.club input[type=checkbox]{width:auto}.result{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}.result:last-child{border-bottom:0}.result .home{text-align:right}.score{font-weight:850;font-size:18px;white-space:nowrap}.pill{font-size:11px;border-radius:20px;background:#233a50;color:#b6d6f5;padding:4px 8px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}th,td{text-align:right;padding:10px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600}th:nth-child(2),td:nth-child(2){text-align:left}td:first-child,th:first-child{text-align:center}.teamname{font-weight:650}.positive{color:var(--green)}footer{color:var(--muted);font-size:12px;text-align:center;padding:20px}@media(max-width:760px){.layout{grid-template-columns:1fr;padding:15px}.nav{position:static;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.nav button{text-align:center;font-size:12px;padding:9px 4px}.grid{grid-template-columns:1fr}.stats{gap:7px}.stat{padding:12px}.stat strong{font-size:22px}header{padding:12px 16px}.formrow{flex-wrap:wrap}.clublist{grid-template-columns:1fr}.topline{align-items:flex-start}h1{font-size:23px}}
</style></head>
<body>
<header><div class="logo"><div class="ball">⚽</div><div>FutSim<small>FUTEBOL • SIMULAÇÃO</small></div></div><div style="margin-left:auto" class="muted small">Resultados fictícios · temporada personalizada</div></header>
<div class="layout"><nav class="nav" id="nav">
<button class="active" data-page="inicio">⌂ &nbsp; Início</button><button data-page="campeonatos">▤ &nbsp; Campeonatos</button><button data-page="times">⚑ &nbsp; Times</button><button data-page="resultados">◷ &nbsp; Resultados</button><button data-page="sobre">ⓘ &nbsp; Sobre</button>
</nav><main class="content" id="app"></main></div><footer>FutSim · Simulador independente para campeonatos fictícios</footer>
<script>
const $=s=>document.querySelector(s);
const initialTeams=[['Flamengo',88],['Palmeiras',89],['São Paulo',82],['Corinthians',80],['Santos',76],['Grêmio',83],['Internacional',82],['Atlético-MG',85],['Cruzeiro',79],['Botafogo',81],['Fluminense',82],['Vasco',77]];
let state;try{state=JSON.parse(localStorage.getItem('futsim_v2'))}catch(e){}
if(!state)state={teams:initialTeams.map((t,i)=>({id:i+1,name:t[0],strength:t[1]})),leagues:[],results:[],nextId:100};
function save(){localStorage.setItem('futsim_v2',JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let page='inicio';
function setPage(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo({top:0,behavior:'smooth'})}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});
function standings(l){let rows=l.teamIds.map(id=>{let t=state.teams.find(x=>x.id===id);return t?{id,name:t.name,pts:0,pj:0,v:0,e:0,d:0,gp:0,gc:0}:null}).filter(Boolean);for(const r of state.results.filter(x=>x.leagueId===l.id)){let h=rows.find(t=>t.id===r.homeId),a=rows.find(t=>t.id===r.awayId);if(!h||!a)continue;h.pj++;a.pj++;h.gp+=r.hg;h.gc+=r.ag;a.gp+=r.ag;a.gc+=r.hg;if(r.hg>r.ag){h.v++;h.pts+=3;a.d++}else if(r.hg<r.ag){a.v++;a.pts+=3;h.d++}else{h.e++;a.e++;h.pts++;a.pts++}}return rows.sort((a,b)=>b.pts-a.pts||(b.gp-b.gc)-(a.gp-a.gc)||b.gp-a.gp||a.name.localeCompare(b.name))}
function table(l){let rows=standings(l);return '<div class="tablewrap"><table><thead><tr><th>#</th><th>Clube</th><th>P</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th></tr></thead><tbody>'+rows.map((t,i)=>'<tr><td>'+(i+1)+'</td><td class="teamname">'+esc(t.name)+'</td><td class="positive"><b>'+t.pts+'</b></td><td>'+t.pj+'</td><td>'+t.v+'</td><td>'+t.e+'</td><td>'+t.d+'</td><td>'+(t.gp-t.gc)+'</td></tr>').join('')+'</tbody></table></div>'}
function resultRow(r){let h=state.teams.find(t=>t.id===r.homeId),a=state.teams.find(t=>t.id===r.awayId);if(!h||!a)return '';let l=state.leagues.find(x=>x.id===r.leagueId);return '<div class="result"><div class="home">'+esc(h.name)+'</div><div class="score">'+r.hg+' : '+r.ag+'</div><div>'+esc(a.name)+' <span class="muted small">'+(l?' · '+esc(l.name):'')+'</span></div></div>'}
function poisson(lambda){let L=Math.exp(-lambda),k=0,p=1;do{k++;p*=Math.random()}while(p>L&&k<12);return k-1}
function play(l,f){let h=state.teams.find(t=>t.id===f.homeId),a=state.teams.find(t=>t.id===f.awayId);if(!h||!a)return;let diff=(h.strength-a.strength)/100;let hg=Math.min(8,poisson(Math.max(.25,1.3+diff*1.7+.22))),ag=Math.min(8,poisson(Math.max(.2,1.15-diff*1.5)));state.results.push({id:state.nextId++,leagueId:l.id,homeId:h.id,awayId:a.id,hg,ag,round:f.round})}
function createLeague(name,ids,kind){if(ids.length<2)return alert('Escolha pelo menos 2 clubes.');let fixtures=[],round=1;for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){fixtures.push({homeId:ids[i],awayId:ids[j],round});if(kind==='Liga')fixtures.push({homeId:ids[j],awayId:ids[i],round:round+Math.max(1,ids.length-1)})}let l={id:state.nextId++,name,kind,teamIds:ids,fixtures};state.leagues.push(l);save();render();alert('Campeonato criado! Já pode simular os jogos.')}
function simulateRound(id){let l=state.leagues.find(x=>x.id===id);if(!l)return;let pending=l.fixtures.filter(f=>!state.results.some(r=>r.leagueId===id&&r.homeId===f.homeId&&r.awayId===f.awayId));if(!pending.length)return alert('Todos os jogos deste campeonato já foram simulados.');let round=pending[0].round;pending.filter(f=>f.round===round).forEach(f=>play(l,f));save();render()}
function simulateAll(id){let l=state.leagues.find(x=>x.id===id);if(!l)return;l.fixtures.filter(f=>!state.results.some(r=>r.leagueId===id&&r.homeId===f.homeId&&r.awayId===f.awayId)).forEach(f=>play(l,f));save();render()}
function deleteLeague(id){if(confirm('Excluir este campeonato e seus resultados?')){state.leagues=state.leagues.filter(l=>l.id!==id);state.results=state.results.filter(r=>r.leagueId!==id);save();render()}}
function deleteTeam(id){if(state.leagues.some(l=>l.teamIds.includes(id)))return alert('Este clube participa de um campeonato. Exclua o campeonato primeiro.');if(confirm('Remover este clube?')){state.teams=state.teams.filter(t=>t.id!==id);save();render()}}
function render(){let app=$('#app'),played=state.results.length;
if(page==='inicio'){app.innerHTML='<div class="topline"><div><h1>Painel geral</h1><div class="muted">Seu centro de campeonatos de futebol.</div></div><button class="primary" data-go="campeonatos">＋ Criar campeonato</button></div><div class="stats"><div class="stat"><strong>'+state.leagues.length+'</strong><span>Campeonatos</span></div><div class="stat"><strong>'+state.teams.length+'</strong><span>Clubes cadastrados</span></div><div class="stat"><strong>'+played+'</strong><span>Jogos simulados</span></div></div><div class="grid"><div class="stack"><section class="card"><div class="cardhead"><h2>Meus campeonatos</h2><button data-go="campeonatos">Ver todos →</button></div>'+(state.leagues.map(l=>'<div class="cardbody" style="border-bottom:1px solid var(--line)"><b>'+esc(l.name)+'</b><div class="muted small">'+l.kind+' · '+state.results.filter(r=>r.leagueId===l.id).length+'/'+l.fixtures.length+' jogos</div><div class="formrow" style="margin:10px 0 0"><button data-round="'+l.id+'">Simular rodada</button><button data-open="'+l.id+'">Classificação</button></div></div>').join('')||'<div class="empty">Crie seu primeiro campeonato para começar.</div>')+'</section></div><div class="stack"><section class="card"><div class="cardhead"><h2>Últimos resultados</h2><button data-go="resultados">Ver todos →</button></div>'+(state.results.slice(-6).reverse().map(resultRow).join('')||'<div class="empty">Os placares aparecerão aqui depois da simulação.</div>')+'</section><section class="card"><div class="cardhead"><h2>Como começar</h2></div><div class="cardbody muted">1. Crie um campeonato.<br><br>2. Escolha os clubes participantes.<br><br>3. Simule rodadas e acompanhe a classificação.</div></section></div></div>'}
if(page==='times'){app.innerHTML='<div class="topline"><div><h1>Clubes</h1><div class="muted">Clubes ficticiamente avaliados; placares sempre simulados.</div></div></div><section class="card"><div class="cardhead"><h2>Cadastrar clube</h2></div><div class="cardbody"><form id="teamForm" class="formrow"><input id="teamName" placeholder="Nome do clube" required maxlength="60"><input id="strength" type="number" min="1" max="100" value="75" aria-label="Força de 1 a 100" style="max-width:120px"><button class="primary">Adicionar</button></form><div class="clublist">'+state.teams.map(t=>'<div class="club"><span><b>'+esc(t.name)+'</b><br><small class="muted">Força '+t.strength+'/100</small></span><button class="danger" data-delete-team="'+t.id+'">Remover</button></div>').join('')+'</div></div></section>';$('#teamForm').addEventListener('submit',e=>{e.preventDefault();let name=$('#teamName').value.trim(),strength=Math.max(1,Math.min(100,Number($('#strength').value)||75));if(!name)return;if(state.teams.some(t=>t.name.toLowerCase()===name.toLowerCase()))return alert('Este clube já está cadastrado.');state.teams.push({id:state.nextId++,name,strength});save();render()})}
if(page==='campeonatos'){app.innerHTML='<div class="topline"><div><h1>Campeonatos</h1><div class="muted">Crie ligas de pontos corridos e torneios personalizados.</div></div></div><div class="grid"><section class="card"><div class="cardhead"><h2>Novo campeonato</h2></div><div class="cardbody"><form id="leagueForm"><input id="leagueName" placeholder="Nome do campeonato" required maxlength="80"><select id="kind" style="margin-top:10px"><option>Liga</option><option>Copa</option><option>Torneio</option></select><p class="muted small">Selecione pelo menos dois clubes:</p><div class="clublist">'+state.teams.map(t=>'<label class="club"><span>'+esc(t.name)+'<br><small class="muted">Força '+t.strength+'</small></span><input type="checkbox" name="club" value="'+t.id+'" checked></label>').join('')+'</div><button class="primary" type="submit">Criar campeonato</button></form></div></section><div class="stack">'+(state.leagues.map(l=>'<section class="card"><div class="cardhead"><div><h2>'+esc(l.name)+'</h2><span class="muted small">'+l.kind+' · '+l.teamIds.length+' clubes</span></div><button class="danger" data-delete-league="'+l.id+'">Excluir</button></div><div class="cardbody"><div class="muted small">'+state.results.filter(r=>r.leagueId===l.id).length+' de '+l.fixtures.length+' jogos simulados</div><div class="formrow" style="margin-top:12px"><button class="primary" data-round="'+l.id+'">Simular rodada</button><button data-all="'+l.id+'">Simular todos</button></div><h2 style="margin:18px 0 8px">Classificação</h2>'+table(l)+'</div></section>').join('')||'<div class="card empty">Nenhum campeonato criado.</div>')+'</div></div>';$('#leagueForm').addEventListener('submit',e=>{e.preventDefault();createLeague($('#leagueName').value.trim(),[...document.querySelectorAll('input[name=club]:checked')].map(x=>Number(x.value)),$('#kind').value)})}
if(page==='resultados'){app.innerHTML='<div class="topline"><div><h1>Resultados</h1><div class="muted">Todos os placares são fictícios e gerados pelo simulador.</div></div><button class="danger" data-clear>Limpar resultados</button></div>'+(state.leagues.map(l=>'<section class="card"><div class="cardhead"><h2>'+esc(l.name)+'</h2><span class="muted small">'+state.results.filter(r=>r.leagueId===l.id).length+' jogos</span></div>'+(state.results.filter(r=>r.leagueId===l.id).slice().reverse().map(resultRow).join('')||'<div class="empty">Ainda sem jogos simulados.</div>')+'</section>').join('')||'<div class="card empty">Crie um campeonato para começar.</div>')}
if(page==='sobre'){app.innerHTML='<div class="topline"><div><h1>Sobre o FutSim</h1><div class="muted">Gerenciador de campeonatos com resultados simulados.</div></div></div><section class="card"><div class="cardbody"><h2>Como funciona</h2><p class="muted">A força de cada clube influencia a simulação dos gols, junto com um fator de mando de campo. As classificações são recalculadas a partir dos resultados registrados.</p><p class="muted">Os dados são salvos no armazenamento local deste navegador. Eles não sincronizam automaticamente com outros dispositivos. Clubes reais podem ser cadastrados, mas todos os placares são fictícios.</p><p class="muted">A opção Copa ainda usa uma lista de confrontos em vez de chave eliminatória.</p><button class="danger" data-reset>Restaurar dados iniciais</button></div></section>'}
app.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.go)));
app.querySelectorAll('[data-round]').forEach(b=>b.addEventListener('click',()=>simulateRound(Number(b.dataset.round))));
app.querySelectorAll('[data-all]').forEach(b=>b.addEventListener('click',()=>simulateAll(Number(b.dataset.all))));
app.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>setPage('campeonatos')));
app.querySelectorAll('[data-delete-league]').forEach(b=>b.addEventListener('click',()=>deleteLeague(Number(b.dataset.deleteLeague))));
app.querySelectorAll('[data-delete-team]').forEach(b=>b.addEventListener('click',()=>deleteTeam(Number(b.dataset.deleteTeam))));
app.querySelector('[data-clear]')?.addEventListener('click',()=>{if(confirm('Apagar todos os resultados?')){state.results=[];save();render()}});
app.querySelector('[data-reset]')?.addEventListener('click',()=>{if(confirm('Apagar seus dados e restaurar os clubes iniciais?')){localStorage.removeItem('futsim_v2');state=null;location.reload()}});
}
render();
</script></body></html>
