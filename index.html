  if(canonical.has(key))duplicateMap.set(t.id,canonical.get(key).id);
  else canonical.set(key,t);
 });
 if(duplicateMap.size){
  const resolve=id=>{let next=id,guard=0;while(duplicateMap.has(next)&&guard++<20)next=duplicateMap.get(next);return next};
  state.leagues.forEach(l=>{
   l.teamIds=[...new Set((l.teamIds||[]).map(resolve))];
   l.fixtures=(l.fixtures||[]).map(f=>({...f,homeId:resolve(f.homeId),awayId:resolve(f.awayId)}));

  state.seasons.forEach(season=>{if(season.championId!=null)season.championId=resolve(season.championId)});
