*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:var(--text);background:#24282c;border:1px solid #3a4147;border-radius:6px;padding:9px 12px;transition:background .15s,border-color .15s}button:hover{background:#30363b;border-color:#59636c}button.primary{background:var(--green);border-color:var(--green);color:#25220d;font-weight:750}button.primary:hover{background:#ffda38}button.danger{color:#ff7b86}input,select{width:100%;background:#222629;border:1px solid #3a4147;color:var(--text);padding:11px;border-radius:6px;outline-color:#e2b900}header{display:flex;align-items:center;gap:16px;padding:0 max(18px,calc((100% - 1260px)/2));min-height:68px;border-bottom:1px solid var(--line);background:#191c1f;position:sticky;top:0;z-index:5;box-shadow:0 1px 4px rgba(20,30,40,.04)}.logo{display:flex;align-items:center;gap:10px;font-weight:850;font-size:22px;letter-spacing:-.7px;white-space:nowrap;color:#f4f6f8}.logo small{display:block;font-size:9px;letter-spacing:1.5px;color:#9ba5ae;font-weight:750}.ball{display:grid;place-items:center;width:39px;height:39px;background:var(--green);color:#222;border-radius:50%;font-size:21px}header .muted{margin-left:auto!important;background:#24282c;padding:7px 10px;border-radius:5px}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px;max-width:1260px;margin:auto;padding:24px 18px;min-height:calc(100vh - 140px)}.nav{display:flex;flex-direction:column;gap:4px;align-self:start;position:sticky;top:91px;background:#191c1f;border:1px solid var(--line);border-radius:8px;padding:10px;box-shadow:var(--shadow)}.nav:before{content:"MENU PRINCIPAL";font-size:10px;letter-spacing:1.1px;font-weight:800;color:#9aa4af;padding:8px 10px}.nav button{text-align:left;background:transparent;border:0;border-radius:6px;color:#c3cbd2;padding:11px 12px;font-weight:650}.nav button.active{background:#3b kground:#30363b;border-radius:5px;padding:3px 10px;letter-spacing:.5px}.pill{font-size:11px;border-radius:20px;background:#24384b;color:#8dc4ff;padding:4px 8px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}th,td{text-align:right;padding:11px 9px;border-bottom:1px solid #30363b}th{color:#aab4bd;font-weight:700;background:#222629;font-size:11px;text-transform:uppercase;letter-spacing:.4px}th:nth-child(2),td:nth-child(2){text-align:left}td:first-child,th:first-child{text-align:center}tbody tr:hover{background:#252a2e}.teamname{font-weight:650}.positive{color:#f5c400}

@media(max-width:390px){header .muted{display:none}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.nav button{font-size:11px}}
</style></head>
<body>
<header><div class="logo"><div class="ball">⚽</div><div>FutSim<small>FUTEBOL • SIMULAÇÃO</small></div></div><div style="margin-left:auto" class="muted small">PLACARES SIMULADOS · SEU FUTEBOL, SUAS REGRAS</div></header>
<div class="layout"><nav class="nav" id="nav"><button class="active" data-page="inicio">⌂ &nbsp; Visão geral</button><div id="countryNav"></div><button data-page="resultados">◷ &nbsp; Resultados</button><button data-page="sobre">ⓘ &nbsp; Sobre o FutSim</button></nav><main class="content" id="app"></main></div><footer>FutSim · Simulador independente para campeonatos fictícios</footer>
<script>
const $=s=>document.querySelector(s);
const initialTeams=[["Athletico-PR","CAP","Brasil","Paraná","Curitiba",78,["#E32636","#000000"]],["Atlético-MG","CAM","Brasil","Minas Gerais","Belo Horizonte",84,["#000000","#FFFFFF"]],["Bahia","BAH","Brasil","Bahia","Salvador",79,["#0066B3","#FFFFFF","#D71920"]],["Botafogo","BOT","Brasil","Rio de Janeiro","Rio de Janeiro",82,["#000000","#FFFFFF"]],["Chapecoense","CHA","Brasil","Santa Catarina","Chapecó",70,["#00843D","#FFFFFF"]],["Corinthians","COR","Brasil","São Paulo","São Paulo",81,["#000000","#FFFFFF"]],["Coritiba","CFC","Brasil","Paraná","Curitiba",72,["#006B3F","#FFFFFF"]],["Cruzeiro","CRU","Brasil","Minas Gerais","Belo Horizonte",83,["#003DA5","#FFFFFF"]],["Flamengo","FLA","Brasil","Rio de Janeiro","Rio de Janeiro",88,["#C8102E","#000000"]],["Fluminense","FLU","Brasil","Rio de Janeiro","Rio de Janeiro",82,["#7A263A","#006747","#FFFFFF"]],["Grêmio","GRE","Brasil","Rio Grande do Sul","Porto Alegre",81,["#00AEEF","#000000","#FFFFFF"]],["Internacional","INT","Brasil","Rio Grande do Sul","Porto Alegre",80,["#E30613","#FFFFFF"]],["Mirassol","MIR","Brasil","São Paulo","Mirassol",77,["#00843D","#FFFF00"]],["Palmeiras","PAL","Brasil","São Paulo","São Paulo",89,["#006437","#FFFFFF"]],["Bragantino","RBB","Brasil","São Paulo","Bragança Paulista",78,["#E30613","#FFFFFF","#000000"]],["Remo","REM","Brasil","Pará","Belém",71,["#003DA5","#FFFFFF"]],["Santos","SAN","Brasil","São Paulo","Santos",79,["#000000","#FFFFFF"]],["São Paulo","SAO","Brasil","São Paulo","São Paulo",85,["#E30613","#FFFFFF","#000000"]],["Vasco","VAS","Brasil","Rio de Janeiro","Rio de Janeiro",77,["#000000","#FFFFFF"]],["Vitória","VIT","Brasil","Bahia","Salvador",75,["#E31B23","#000000"]]];
let state;try{state=JSON.parse(localStorage.getItem('futsim_v2'))}catch(e){}
if(!state)state={teams:initialTeams.map((t,i)=>({id:i+1,name:t[0],strength:t[1]})),leagues:[],results:[],nextId:100};
state.teams=Array.isArray(state.teams)?state.teams:[];state.leagues=Array.isArray(state.leagues)?state.leagues:[];state.results=Array.isArray(state.results)?state.results:[];state.seasons=Array.isArray(state.seasons)?state.seasons:[];
// Remove os clubes de demonstração antigos e instala a base do Brasileirão uma única vez.
if(state.demoClubsRemoved!==true){const demoNames=new Set(['Flamengo','Palmeiras','São Paulo','Corinthians','Santos','Grêmio','Internacional','Atlético-MG','Cruzeiro','Botafogo','Fluminense','Vasco']);const demoIds=new Set(state.teams.filter(t=>demoNames.has(t.name)).map(t=>t.id));const removedLeagueIds=new Set(state.leagues.filter(l=>Array.isArray(l.teamIds)&&l.teamIds.some(id=>demoIds.has(id))).map(l=>l.id));state.teams=state.teams.filter(t=>!demoIds.has(t.id));state.leagues=state.leagues.filter(l=>!removedLeagueIds.has(l.id));state.results=state.results.filter(r=>!demoIds.has(r.homeId)&&!demoIds.has(r.awayId)&&!removedLeagueIds.has(r.leagueId));state.demoClubsRemoved=true}
if(state.brasileiraoSeedVersion!==1){
 const ids=[];
 initialTeams.forEach(t=>{let team=state.teams.find(x=>x.abbreviation===t[1]||x.shortName===t[0]);if(!team){team={id:state.nextId++,name:t[0],abbreviation:t[1],country:t[2],stateName:t[3],city:t[4],strength:t[5],baseStrength:t[5],colors:t[6]};state.teams.push(team)}else{team.name=t[0];team.shortName=t[0];team.abbreviation=t[1];team.country=t[2];team.stateName=t[3];team.city=t[4];team.colors=t[6];if(typeof team.baseStrength!=='number')team.baseStrength=t[5];if(typeof team.strength!=='number')team.strength=t[5]}ids.push(team.id)});
 let league=state.leagues.find(l=>l.name==='Campeonato Brasileiro'||l.name==='Brasileirão');
 if(!league){const fixtures=buildLeagueFixtures(ids,2);league={id:state.nextId++,name:'Campeonato Brasileiro',shortName:'Brasileirão',country:'Brasil',kind:'Liga',format:'Pontos corridos',regulation:'Disputada por vinte clubes em dois turnos. Em cada turno, todos os times jogarão entre si uma única vez. Os jogos do segundo turno serão realizados na mesma ordem do primeiro, apenas com o mando de campo invertido. Não há campeões por turnos, sendo declarado campeão brasileiro o time que obtiver o maior número de pontos após as 38 rodadas.',teamIds:ids,fixtures,turns:2};state.leagues.push(league)}
 state.brasileiraoSeedVersion=1;save()
}
// Corrige instalações que já tinham a liga criada, mas ainda não tinham os nomes curtos e metadados dos clubes.
let clubMetadataChanged=false;
initialTeams.forEach(t=>{const team=state.teams.find(x=>x.shortName===t[0]||x.abbreviation===t[1]);if(!team)return;
 if(team.name!==t[0]){team.name=t[0];clubMetadataChanged=true}
 if(team.shortName!==t[0]){team.shortName=t[0];clubMetadataChanged=true}
 if(team.abbreviation!==t[1]){team.abbreviation=t[1];clubMetadataChanged=true}
 if(team.country!==t[2]){team.country=t[2];clubMetadataChanged=true}
 if(team.stateName!==t[3]){team.stateName=t[3];clubMetadataChanged=true}
 if(team.city!==t[4]){team.city=t[4];clubMetadataChanged=true}
 if(!Array.isArray(team.colors)||JSON.stringify(team.colors)!==JSON.stringify(t[6])){team.colors=t[6];clubMetadataChanged=true}
 if(typeof team.baseStrength!=='number'){team.baseStrength=t[5];clubMetadataChanged=true}
});
// Migração definitiva: nomes completos antigos passam a ser os nomes curtos em todo o sistema.
const legacyShortNames={
 'Club Athletico Paranaense':'Athletico-PR',
 'Clube Atlético Mineiro':'Atlético-MG',
 'Esporte Clube Bahia':'Bahia',
 'Botafogo de Futebol e Regatas':'Botafogo',
 'Associação Chapecoense de Futebol':'Chapecoense',
 'Sport Club Corinthians Paulista':'Corinthians',
 'Coritiba Foot Ball Club':'Coritiba',
 'Cruzeiro Esporte Clube':'Cruzeiro',
 'Clube de Regatas do Flamengo':'Flamengo',
 'Fluminense Football Club':'Fluminense',
 'Grêmio Foot-Ball Porto Alegrense':'Grêmio',
 'Sport Club Internacional':'Internacional',
 'Mirassol Futebol Clube':'Mirassol',
 'Sociedade Esportiva Palmeiras':'Palmeiras',
 'Red Bull Bragantino Futebol Ltda.':'Bragantino',
 'Clube do Remo':'Remo',
 'Santos Futebol Clube':'Santos',
 'São Paulo Futebol Clube':'São Paulo',
 'Club de Regatas Vasco da Gama':'Vasco',
 'Esporte Clube Vitória':'Vitória'
};
let namesNormalized=false;
state.teams.forEach(team=>{const short=legacyShortNames[team.name]||team.shortName;if(short&&team.name!==short){team.name=short;namesNormalized=true}if(short&&team.shortName!==short){team.shortName=short;namesNormalized=true}});
if(clubMetadataChanged||namesNormalized)save();
function applyRating(result){let h=state.teams.find(t=>t.id===result.homeId),a=state.teams.find(t=>t.id===result.awayId);if(!h||!a)return;let hs=Number(h.strength)||50,as=Number(a.strength)||50,expected=1/(1+Math.pow(10,(as-hs)/20)),actual=result.hg>result.ag?1:result.hg<result.ag?0:.5,k=3.2,change=k*(actual-expected);h.strength=Math.max(1,Math.min(100,Math.round((hs+change)*10)/10));a.strength=Math.max(1,Math.min(100,Math.round((as-change)*10)/10));result.homeRatingChange=Math.round((h.strength-hs)*10)/10;result.awayRatingChange=Math.round((a.strength-as)*10)/10}
function save(){localStorage.setItem('futsim_v2',JSON.stringify(state))}
// Migração segura: preserva os campeonatos e placares existentes e recalcula a força dinâmica uma única vez.
if(state.ratingSystemVersion!==1){state.teams.forEach(t=>{if(typeof t.baseStrength!=='number')t.baseStrength=Number(t.strength)||75;t.strength=Math.max(1,Math.min(100,Number(t.baseStrength)||75))});state.results.slice().sort((a,b)=>(Number(a.id)||0)-(Number(b.id)||0)).forEach(r=>applyRating(r));state.ratingSystemVersion=1;save()}else{state.teams.forEach(t=>{if(typeof t.baseStrength!=='number')t.baseStrength=Number(t.strength)||75})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let page='inicio';
let selectedRounds={};let selectedCountry=null;let selectedLeagueId=null;
function teamCountry(t){return t.country||t.countryName||'Brasil'}function leagueCountry(l){if(l.country)return l.country;const t=state.teams.find(x=>l.teamIds.includes(x.id));return t?teamCountry(t):'Brasil'}function countries(){return [...new Set([...state.leagues.map(leagueCountry),...state.teams.map(teamCountry)].filter(Boolean))].sort((a,b)=>a.localeCompare(b))}function countryLeagues(){return state.leagues.filter(l=>!selectedCountry||leagueCountry(l)===selectedCountry)}function activeLeague(){let ls=countryLeagues(),l=ls.find(x=>x.id===selectedLeagueId);if(!l){l=ls[0]||null;selectedLeagueId=l?l.id:null}return l}function setCountry(country){selectedCountry=country;selectedLeagueId=null;page='campeonatos';render();window.scrollTo({top:0,behavior:'smooth'})}function setPage(p){page=p;if(['campeonatos','classificacao','calendario','temporadas','times'].includes(p))activeLeague();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo({top:0,behavior:'smooth'})}function renderCountryNav(){const host=$('#countryNav');if(!host)return;host.innerHTML=selectedCountry?'<div class="navgroup-title">'+esc(selectedCountry)+'</div><button data-page="campeonatos">▤ &nbsp; Campeonatos</button><button data-page="classificacao">▥ &nbsp; Classificação</button><button data-page="calendario">▦ &nbsp; Calendário</button><button data-page="temporadas">🏆 &nbsp; Temporadas</button><button data-page="times">⚑ &nbsp; Clubes</button>':'';host.querySelectorAll('button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page);const country=e.target.closest('button[data-country]');if(country)setCountry(country.dataset.country);const league=e.target.closest('button[data-pick-league]');if(league){selectedLeagueId=Number(league.dataset.pickLeague);setPage('classificacao')}});
function standings(l){let rows=l.teamIds.map(id=>{let t=state.teams.find(x=>x.id===id);return t?{id,name:t.name,pts:0,pj:0,v:0,e:0,d:0,gp:0,gc:0}:null}).filter(Boolean);for(const r of state.results.filter(x=>x.leagueId===l.id)){let h=rows.find(t=>t.id===r.homeId),a=rows.find(t=>t.id===r.awayId);if(!h||!a)continue;h.pj++;a.pj++;h.gp+=r.hg;h.gc+=r.ag;a.gp+=r.ag;a.gc+=r.hg;if(r.hg>r.ag){h.v++;h.pts+=3;a.d++}else if(r.hg<r.ag){a.v++;a.pts+=3;h.d++}else{h.e++;a.e++;h.pts++;a.pts++}}return rows.sort((a,b)=>b.pts-a.pts||b.v-a.v||((b.gp-b.gc)-(a.gp-a.gc))||b.gp-a.gp||a.name.localeCompare(b.name))}

function poisson(lambda){let L=Math.exp(-lambda),k=0,p=1;do{k++;p*=Math.random()}while(p>L&&k<12);return k-1}
function play(l,f,deferRating=false){let h=state.teams.find(t=>t.id===f.homeId),a=state.teams.find(t=>t.id===f.awayId);if(!h||!a)return null;let hs=Number(h.strength)||50,as=Number(a.strength)||50,diff=(hs-as)/100;let hg=Math.min(8,poisson(Math.max(.25,1.3+diff*1.7+.22))),ag=Math.min(8,poisson(Math.max(.2,1.15-diff*1.5)));let result={id:state.nextId++,leagueId:l.id,homeId:h.id,awayId:a.id,hg,ag,round:f.round,homeRatingBefore:hs,awayRatingBefore:as};state.results.push(result);if(!deferRating)applyRating(result);return result}
function buildLeagueFixtures(ids,turns){let rotation=ids.slice();if(rotation.length%2)rotation.push(null);let n=rotation.length,half=n/2,fixtures=[],round=1;for(let r=0;r<n-1;r++){for(let i=0;i<half;i++){let a=rotation[i],b=rotation[n-1-i];if(a!==null&&b!==null){let home=(r+i)%2===0?a:b,away=(r+i)%2===0?b:a;fixtures.push({homeId:home,awayId:away,round})}}let fixed=rotation[0];let rest=rotation.slice(1);rest.unshift(rest.pop());rotation=[fixed,...rest];round++}if(turns===2){const first=fixtures.slice();first.forEach(f=>fixtures.push({homeId:f.awayId,awayId:f.homeId,round:f.round+n-1}))}return fixtures}

function endSeason(id){const l=state.leagues.find(x=>x.id===id);if(!l)return;if(l.seasonCompleted)return alert('Temporada já encerrada.');if(playedCount(l)<l.fixtures.length)return alert('Só é possível encerrar depois de todos os jogos.');if(!confirm('Encerrar a temporada '+(l.season||1)+' de '+l.name+' e guardar o campeão no histórico?'))return;const rows=standings(l),results=state.results.filter(r=>r.leagueId===l.id).map(r=>({...r})),seasonNo=Number(l.season)||1;state.seasons.push({id:state.nextId++,leagueId:l.id,leagueName:l.name,season:seasonNo,championId:rows[0]?.id??null,championName:rows[0]?.name??'Sem campeão',table:rows.map((t,i)=>({...t,position:i+1})),results,completedAt:new Date().toISOString(),format:l.kind});l.seasonCompleted=true;save();render();alert('Temporada encerrada! Use “Próxima temporada” para continuar.')}

function fixturePlayed(l,f){return state.results.some(r=>r.leagueId===l.id&&r.homeId===f.homeId&&r.awayId===f.awayId)}
function playedCount(l){return state.results.filter(r=>r.leagueId===l.id).length}
function nextRound(l){let pending=l.fixtures.filter(f=>!fixturePlayed(l,f));return pending.length?Math.min(...pending.map(f=>Number(f.round)||1)):null}
function simulateRound(id){let l=state.leagues.find(x=>x.id===id);if(!l||l.seasonCompleted)return;let round=nextRound(l);if(round===null)return alert('Todos os jogos deste campeonato já foram simulados.');let games=l.fixtures.filter(f=>(Number(f.round)||1)===round&&!fixturePlayed(l,f)).map(f=>play(l,f,true)).filter(Boolean);games.forEach(applyRating);save();render()}

function simulateAll(id){let l=state.leagues.find(x=>x.id===id);if(!l||l.seasonCompleted)return;let rounds=[...new Set(l.fixtures.filter(f=>!fixturePlayed(l,f)).map(f=>Number(f.round)||1))].sort((a,b)=>a-b);rounds.forEach(round=>{let games=l.fixtures.filter(f=>(Number(f.round)||1)===round&&!fixturePlayed(l,f)).map(f=>play(l,f,true)).filter(Boolean);games.forEach(applyRating)});save();render()}

>'+(nextRound(l)!==null?'Simular próxima rodada':'Temporada concluída')+'</button><button data-all="'+l.id+'">Simular todos</button>'+(nextRound(l)===null?'<button data-end-season="'+l.id+'">Encerrar temporada</button>':''))+'</div><h2 style="margin:18px 0 8px">Classificação</h2>'+table(l)+'<h2 style="margin:18px 0 8px">Próximos jogos</h2>'+(l.fixtures.filter(f=>!fixturePlayed(l,f)).slice(0,6).map(f=>{let h=state.teams.find(t=>t.id===f.homeId),a=state.teams.find(t=>t.id===f.awayId);return h&&a?'<div class="result"><div class="home">'+esc(h.name)+'</div><div class="pill">Rodada '+(f.round||1)+'</div><div>'+esc(a.name)+'</div></div>':''}).join('')||'<div class="empty">Todos os jogos foram disputados.</div>')+'</div></section>').join('')||'<div class="card empty">Nenhum campeonato criado.</div>')+'</div></div>';$('#leagueForm').addEventListener('submit',e=>{e.preventDefault();createLeague($('#leagueName').value.trim(),[...document.querySelectorAll('input[name=club]:checked')].map(x=>Number(x.value)),$('#kind').value,Number($('#turns').value),selectedCountry)})}
if(page==='classificacao'){const l=activeLeague();app.innerHTML='<div class="topline"><div><h1>Classificação</h1><div class="muted">'+esc(selectedCountry||'País')+' · '+(l?esc(l.name):'Selecione um campeonato')+'</div></div></div><section class="card"><div class="cardhead"><h2>Campeonato selecionado</h2><select id="standingsLeague">'+countryLeagues().map(x=>'<option value="'+x.id+'" '+(l&&x.id===l.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div><div class="cardbody">'+(l?table(l):'<div class="empty">Nenhum campeonato disponível para este país. Crie um na aba Campeonatos.</div>')+'</div></section>';$('#standingsLeague')?.addEventListener('change',e=>{selectedLeagueId=Number(e.target.value);render()})}
if(page==='temporadas'){app.innerHTML='<div class="topline"><div><h1>Temporadas · '+esc(selectedCountry||'Todos os países')+'</h1><div class="muted">Histórico de campeões e classificações finais. Encerre uma temporada após todos os jogos para arquivá-la e iniciar a próxima.</div></div></div><div class="stats"><div class="stat"><strong>'+state.seasons.length+'</strong><span>Temporadas concluídas</span></div><div class="stat"><strong>'+new Set(state.seasons.map(s=>s.championName)).size+'</strong><span>Clubes campeões</span></div><div class="stat"><strong>'+state.seasons.filter(s=>s.championId!==null).length+'</strong><span>Títulos registrados</span></div></div>'+(state.seasons.filter(s=>{const l=state.leagues.find(x=>x.id===s.leagueId);return selectedCountry?(l?leagueCountry(l)===selectedCountry:s.country===selectedCountry):true}).filter(s=>!activeLeague()||s.leagueId===activeLeague().id).slice().reverse().map(s=>'<section class="card"><div class="cardhead"><div><h2>🏆 '+esc(s.championName)+'</h2><span class="muted small">'+esc(s.leagueName)+' · Temporada '+s.season+' · '+new Date(s.completedAt).toLocaleDateString('pt-BR')+'</span></div><span class="pill">Campeão</span></div><div class="cardbody"><h3>Classificação final</h3><div class="tablewrap"><table><thead><tr><th>#</th><th>Clube</th><th>PTS</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>SG</th></tr></thead><tbody>'+s.table.map(t=>'<tr><td>'+t.position+'</td><td>'+esc(t.name)+'</td><td class="positive"><b>'+t.pts+'</b></td><td>'+t.pj+'</td><td>'+t.v+'</td><td>'+t.e+'</td><td>'+t.d+'</td><td>'+t.gp+'</td><td>'+t.gc+'</td><td>'+(t.gp-t.gc)+'</td></tr>').join('')+'</tbody></table></div><details style="margin-top:12px"><summary>Resultados da temporada ('+s.results.length+' jogos)</summary>'+s.results.map(r=>{const h=state.teams.find(t=>t.id===r.homeId),a=state.teams.find(t=>t.id===r.awayId);return '<div class="result"><div class="home">'+esc(h?.name||'Clube removido')+'</div><div class="score">'+r.hg+' : '+r.ag+'</div><div>'+esc(a?.name||'Clube removido')+'</div></div>'}).join('')+'</details></div></section>').join('')||'<div class="card empty">Nenhuma temporada foi encerrada ainda. Simule todos os jogos de um campeonato e clique em “Encerrar temporada”.</div>')}if(page==='calendario'){app.innerHTML='<div class="topline"><div><h1>Calendário · '+esc(selectedCountry||'Todos os países')+'</h1><div class="muted">Consulte todos os confrontos por rodada e acompanhe o que já foi disputado.</div></div></div>'+((activeLeague()?[activeLeague()]:[]).map(l=>{const rounds=[...new Set(l.fixtures.map(f=>Number(f.round)||1))].sort((a,b)=>a-b);const current=rounds.includes(Number(selectedRounds[l.id]))?Number(selectedRounds[l.id]):(nextRound(l)||rounds[rounds.length-1]||1);const games=l.fixtures.filter(f=>(Number(f.round)||1)===current);return '<section class="card"><div class="cardhead"><div><h2>'+esc(l.name)+'</h2><span class="muted small">'+playedCount(l)+'/'+l.fixtures.length+' jogos · '+rounds.length+' rodadas</span></div><button data-round="'+l.id+'">Simular próxima</button></div><div class="cardbody"><div class="roundnav"><button data-calendar-prev="'+l.id+'" '+(current<=1?'disabled':'')+'>← Anterior</button><select data-calendar-select="'+l.id+'" aria-label="Selecionar rodada">'+rounds.map(r=>'<option value="'+r+'" '+(r===current?'selected':'')+'>Rodada '+r+'</option>').join('')+'</select><button data-calendar-next="'+l.id+'" '+(current>=rounds.length?'disabled':'')+'>Próxima →</button></div><div class="muted small" style="margin-bottom:10px">Rodada '+current+' · '+games.filter(f=>fixturePlayed(l,f)).length+'/'+games.length+' partidas concluídas</div>'+(games.map(f=>{const h=state.teams.find(t=>t.id===f.homeId),a=state.teams.find(t=>t.id===f.awayId),res=state.results.find(r=>r.leagueId===l.id&&r.homeId===f.homeId&&r.awayId===f.awayId);return h&&a?'<div class="result '+(res?'fixtureplayed':'fixturepending')+'"><div class="home">'+esc(h.name)+'</div><div class="score">'+(res?res.hg+' : '+res.ag:'vs')+'</div><div>'+esc(a.name)+'<div class="muted small">'+(res?'Disputado':'Pendente')+'</div></div></div>':''}).join('')||'<div class="empty">Não há jogos nesta rodada.</div>')+'</div></section>'}).join('')||'<div class="card empty">Crie um campeonato para ver o calendário.</div>')}if(page==='resultados'){app.innerHTML='<div class="topline"><div><h1>Resultados</h1><div class="muted">Todos os placares são fictícios e gerados pelo simulador.</div></div><button class="danger" data-clear>Limpar resultados</button></div>'+(state.leagues.map(l=>'<section class="card"><div class="cardhead"><h2>'+esc(l.name)+'</h2><span class="muted small">'+state.results.filter(r=>r.leagueId===l.id).length+' jogos</span></div>'+(state.results.filter(r=>r.leagueId===l.id).slice().reverse().map(resultRow).join('')||'<div class="empty">Ainda sem jogos simulados.</div>')+'</section>').join('')||'<div class="card empty">Crie um campeonato para começar.</div>')}
if(page==='sobre'){app.innerHTML='<div class="topline"><div><h1>Sobre o FutSim</h1><div class="muted">Gerenciador de campeonatos com resultados simulados.</div></div></div><section class="card"><div class="cardbody"><h2>Como funciona</h2><p class="muted">Cada clube tem uma força dinâmica de 1 a 100. Vitórias, empates e derrotas alteram essa nota de acordo com a força relativa do adversário; vencer um time mais forte rende mais, e perder para um mais fraco custa mais. A nota atual influencia os próximos placares.</p><p class="muted">Os dados são salvos no armazenamento local deste navegador. A força atual é recalculada a partir do histórico existente uma única vez e continua evoluindo nas novas partidas. Clubes reais podem ser usados, mas todos os placares são fictícios.</p><p class="muted">A opção Copa ainda usa uma lista de confrontos em vez de chave eliminatória.</p><button class="danger" data-reset>Restaurar dados iniciais</button></div></section>'}
app.querySelectorAll('[data-calendar-select]').forEach(s=>s.addEventListener('change',()=>{selectedRounds[Number(s.dataset.calendarSelect)]=Number(s.value);render()}));
app.querySelectorAll('[data-calendar-prev]').forEach(b=>b.addEventListener('click',()=>{const id=Number(b.dataset.calendarPrev),l=state.leagues.find(x=>x.id===id);if(l){const n=Number(selectedRounds[id]||nextRound(l)||1);selectedRounds[id]=Math.max(1,n-1);render()}}));
app.querySelectorAll('[data-calendar-next]').forEach(b=>b.addEventListener('click',()=>{const id=Number(b.dataset.calendarNext),l=state.leagues.find(x=>x.id===id);if(l){const max=Math.max(...l.fixtures.map(f=>Number(f.round)||1),1),n=Number(selectedRounds[id]||nextRound(l)||1);selectedRounds[id]=Math.min(max,n+1);render()}}));
app.querySelectorAll('[data-team-detail]').forEach(b=>b.addEventListener('click',()=>showTeamDetails(Number(b.dataset.teamDetail))));
app.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.go)));
app.querySelectorAll('[data-end-season]').forEach(b=>b.addEventListener('click',()=>endSeason(Number(b.dataset.endSeason))));app.querySelectorAll('[data-next-season]').forEach(b=>b.addEventListener('click',()=>startNextSeason(Number(b.dataset.nextSeason))));
app.querySelectorAll('[data-round]').forEach(b=>b.addEventListener('click',()=>simulateRound(Number(b.dataset.round))));
app.querySelectorAll('[data-all]').forEach(b=>b.addEventListener('click',()=>simulateAll(Number(b.dataset.all))));
app.querySelectorAll('[data-pick-league]').forEach(b=>b.addEventListener('click',()=>{selectedLeagueId=Number(b.dataset.pickLeague);setPage('classificacao')}));
app.querySelectorAll('[data-delete-league]').forEach(b=>b.addEventListener('click',()=>deleteLeague(Number(b.dataset.deleteLeague))));
app.querySelectorAll('[data-delete-team]').forEach(b=>b.addEventListener('click',()=>deleteTeam(Number(b.dataset.deleteTeam))));
app.querySelector('[data-clear]')?.addEventListener('click',()=>{if(confirm('Apagar todos os resultados?')){state.results=[];save();render()}});
app.querySelector('[data-reset]')?.addEventListener('click',()=>{if(confirm('Apagar seus dados e restaurar os clubes iniciais?')){localStorage.removeItem('futsim_v2');state=null;location.reload()}});
}
render();
</script></body></html>
